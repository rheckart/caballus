# The gate and the artefact.
#
# ADR 0007 puts CI on the OMV8 box at home and never on the VPS: a dependency
# install, a Docker build and a Postgres-backed suite are real contention, and
# evening shift is exactly when code gets pushed. The VPS only ever pulls.
#
# Two jobs, and the second is not the deploy. `publish` puts an image in the
# registry; taking traffic is `deploy.yml`, pressed by a person, because ADR
# 0007 makes migrations a deliberate step and a 6am restart is on the critical
# path of a Lead waiting for the medication list.
name: ci

# Push alone. `workflow_dispatch` was declared here and is removed: on a
# dispatched run this runner fails to plan the workflow at all — *'runs-on' key
# not defined in ci/verify*, before a step executes — and skips `publish` on a
# `github.ref` it evaluates differently from a push. A button that cannot work
# is worse than no button, and this workflow has no reason to be pressed: it
# answers a push. `deploy.yml` is the one a person presses, it has one job with
# no `needs` and no `if`, and it dispatches correctly.
on:
  push:

env:
  IMAGE: git.heckart.me/rob/caballus

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      # ADR 0007 pins Postgres 18 everywhere, having been burned once by a
      # compose file that said 17 while the running container was 18. The
      # database is tested rather than mocked: RLS policies, the idempotency
      # index and versioned reads are database behaviour and a fake proves
      # nothing about any of them.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: caballus
          POSTGRES_PASSWORD: caballus
          POSTGRES_DB: caballus
        options: >-
          --health-cmd "pg_isready -U caballus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The application role, which the policies apply to, and the owner, which
      # migrations and the test seeding use. Two roles, deliberately, because
      # an application connecting as the owner passes every test here and leaks
      # in production (ADR 0007).
      DATABASE_URL: postgres://caballus_app:caballus@postgres:5432/caballus
      ADMIN_DATABASE_URL: postgres://caballus:caballus@postgres:5432/caballus
      APP_ORG_ID: '00000000-0000-0000-0000-000000000001'
      APP_URL: http://localhost:3000
      # Not a secret and not pretending to be one: this database is thrown away
      # at the end of the job. A real one would be a secret that every fork of
      # the log can read.
      BETTER_AUTH_SECRET: ci-only-this-database-is-discarded

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: The client the provisioning script is written for
        # `scripts/provision-database.sql` uses `\gexec` and `:'variable'`,
        # which are psql's and not the wire protocol's, so it needs psql rather
        # than any Postgres client. The job image has none.
        run: |
          apt-get update -qq
          apt-get install -y -qq postgresql-client

      - name: The application role
        run: psql "$ADMIN_DATABASE_URL" -v app_password="caballus" -f scripts/provision-database.sql

      - name: Migrate
        run: npm run db:migrate

      - name: Verify
        # typecheck, lint, the ADR 0016 fixtures, control bytes, tests and the
        # migration check. One command, no partial green (ADR 0007).
        run: npm run verify

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: A Docker client
        # The job image is `node:20-bullseye` and carries none. The static
        # binary is pinned rather than `latest` for the same reason the base
        # image in the Dockerfile is pinned by digest.
        run: |
          curl -fsSL -o /tmp/docker.tgz \
            https://download.docker.com/linux/static/stable/x86_64/docker-28.3.2.tgz
          tar -xzf /tmp/docker.tgz -C /tmp
          install /tmp/docker/docker /usr/local/bin/docker
          docker --version

      - name: The daemon that will do the building
        # The runner creates job containers on its docker-in-docker sidecar, so
        # from inside one the daemon is the workflow network's own gateway. It
        # is read at runtime rather than hard-coded, because the network — and
        # therefore the address — is created fresh per workflow.
        run: |
          GATEWAY=$(awk '$2=="00000000"{g=$3; printf "%d.%d.%d.%d\n", \
            ("0x" substr(g,7,2))+0, ("0x" substr(g,5,2))+0, \
            ("0x" substr(g,3,2))+0, ("0x" substr(g,1,2))+0; exit}' /proc/net/route)
          echo "DOCKER_HOST=tcp://$GATEWAY:2375" >> "$GITHUB_ENV"

      - name: Sign in to the registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login git.heckart.me -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build and push
        # Two tags for one image: the commit, which is what a deploy names and
        # what a rollback comes back to, and `latest`, which is only ever a
        # convenience for a human typing the deploy form.
        run: |
          TAG="${GITHUB_SHA:0:12}"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "pushed $IMAGE:$TAG"
